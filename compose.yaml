name: cossas-ki
services:
  app:
    image: cossas-ki:local
    build: .
    ports:
      - "127.0.0.1:${APEX_PORT:-8000}:8000"
    volumes:
      - reviews:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
volumes:
  reviews:
    name: ${COSSA_DATA_VOLUME:-cossas-ki_reviews}
